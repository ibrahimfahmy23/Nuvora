<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvora - المتجر الفاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --accent-gold: #d4af37;
            --accent-hover: #f3cf65;
            --text-main: #f0f0f0;
            --text-muted: #aaa;
            --border-color: #2a2a30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        /* Header & Nav */
        header {
            background: rgba(24, 24, 28, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 48px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .cart-btn {
            background: linear-gradient(135deg, var(--accent-gold), #aa820a);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .cart-btn:hover {
            background: var(--accent-hover);
        }

        .cart-badge {
            background: #000;
            color: var(--accent-gold);
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 12px;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 40px 20px;
            background: radial-gradient(circle, #25252e 0%, var(--bg-color) 70%);
        }

        .hero h1 {
            color: var(--accent-gold);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Admin Panel */
        .admin-panel {
            background: #1e1e24;
            border: 1px dashed var(--accent-gold);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .admin-panel h3 {
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        .admin-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .admin-form input, .admin-form textarea {
            padding: 10px;
            background: #121215;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
        }

        .admin-form button {
            grid-column: 1 / -1;
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Category Filter */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }

        .cat-btn.active {
            background: var(--accent-gold);
            color: #000;
            font-weight: bold;
        }

        /* Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* Product Card */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
        }

        .product-thumb {
            width: 100%;
            height: 250px;
            background: #000;
        }

        .product-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-list {
            display: flex;
            gap: 6px;
            padding: 8px;
            background: rgba(0,0,0,0.4);
            overflow-x: auto;
        }

        .thumb-list img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #444;
            object-fit: cover;
        }

        .product-details {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-details h3 {
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .price-wrap {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }

        .price {
            font-size: 1.2rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .old-price {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .option-select {
            width: 100%;
            padding: 8px;
            background: #222;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin: 8px 0;
        }

        .btn-primary {
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: var(--accent-gold);
            color: #000;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-inputs {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-inputs input {
            padding: 10px;
            background: #121215;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
        }

        .btn-submit {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            <img src="logo.jpg" alt="Nuvora" onerror="this.style.display='none'">
        </a>
        <button class="cart-btn" onclick="toggleCart()">
            🛒 السلة <span class="cart-badge" id="cart-count">0</span>
        </button>
    </header>

    <section class="hero">
        <h1>منتجات عصرية بجودة استثنائية</h1>
        <p>تسوق أحدث التشكيلات مباشرة مع إمكانية التوصيل والشحن لجميع المحافظات.</p>
    </section>

    <div class="container">

        <!-- Admin Control Panel -->
        <div class="admin-panel" id="admin-panel">
            <h3>لوحة إدارية: إضافة منتج جديد</h3>
            <form id="product-form" onsubmit="handleSaveProduct(event)">
                <input type="hidden" id="edit-id">
                <div class="admin-form">
                    <input type="text" id="p-title" placeholder="اسم المنتج" required>
                    <input type="text" id="p-category" placeholder="القسم (مثال: ملابس، إكسسوارات)" required>
                    <input type="number" id="p-price" placeholder="السعر (ج.م)" required>
                    <input type="number" id="p-old-price" placeholder="السعر القديم (اختياري)">
                    <input type="text" id="p-images" placeholder="روابط الصور (مفصولة بفاصلة , )">
                    <input type="text" id="p-options" placeholder="خيارات/ألوان (مثال: أحمر, أسود, أزرق)">
                    <textarea id="p-desc" placeholder="وصف المنتج" style="grid-column: 1/-1;"></textarea>
                    <button type="submit">حفظ المنتج</button>
                </div>
            </form>
        </div>

        <h2 style="margin-bottom: 15px; color: var(--accent-gold);">أحدث المنتجات</h2>

        <!-- Category Buttons -->
        <div class="categories" id="category-buttons"></div>

        <!-- Products Grid -->
        <div class="products-grid" id="product-container"></div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <h2 style="color:var(--accent-gold); margin-bottom:15px;">سلة الشراء</h2>
            <div id="cart-items"></div>
            <h3 style="margin-top:15px; text-align:left;">الإجمالي: <span id="cart-total">0</span> ج.م</h3>

            <div class="cart-inputs">
                <h4>بيانات التوصيل:</h4>
                <input type="text" id="cust-name" placeholder="الاسم بالكامل">
                <input type="tel" id="cust-phone" placeholder="رقم الهاتف">
                <input type="text" id="cust-address" placeholder="العنوان تفصيلياً (المحافظة/المنطقة)">
                <button class="btn-submit" onclick="submitOrder()">إرسال الطلب عبر التليجرام</button>
                <button style="background:transparent; color:#aaa; border:none; margin-top:5px; cursor:pointer;" onclick="toggleCart()">إغلاق</button>
            </div>
        </div>
    </div>

    <footer>
        © Nuvora Store 2026. جميع الحقوق محفوظة.
    </footer>

    <script>
        // إعدادات التليجرام
        const BOT_TOKEN = '8992277563:AAGL4PZVwqg2YDYb1xDOmk0QWycl_kuykQ8';
        const CHAT_ID = '8951186041';

        let currentCategory = 'الكل';
        let cart = JSON.parse(localStorage.getItem('nuvora_cart')) || [];

        // معالجة روابط درايف تلقائياً
        function formatImgUrl(url) {
            if (!url) return '';
            url = url.trim();
            if (url.includes('drive.google.com') && url.includes('/d/')) {
                const match = url.match(/\/d\/([^\/]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
            }
            return url;
        }

        function getProducts() {
            return JSON.parse(localStorage.getItem('nuvora_products')) || [];
        }

        function saveProducts(products) {
            localStorage.setItem('nuvora_products', JSON.stringify(products));
            renderStore();
        }

        function handleSaveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const title = document.getElementById('p-title').value;
            const category = document.getElementById('p-category').value;
            const price = document.getElementById('p-price').value;
            const oldPrice = document.getElementById('p-old-price').value;
            
            const rawImages = document.getElementById('p-images').value;
            const images = rawImages ? rawImages.split(',').map(img => formatImgUrl(img)).filter(img => img !== '') : [];

            const rawOptions = document.getElementById('p-options').value;
            const options = rawOptions ? rawOptions.split(',').map(opt => opt.trim()).filter(opt => opt !== '') : [];

            let products = getProducts();

            const productData = {
                id: id || Date.now().toString(),
                title,
                category,
                price,
                oldPrice,
                images,
                options,
                desc: document.getElementById('p-desc').value
            };

            if (id) {
                products = products.map(p => p.id === id ? productData : p);
            } else {
                products.push(productData);
            }

            saveProducts(products);
            document.getElementById('product-form').reset();
            document.getElementById('edit-id').value = '';
            alert('تم حفظ المنتج بنجاح!');
        }

        function renderCategoryButtons() {
            const products = getProducts();
            const categories = ['الكل', ...new Set(products.map(p => p.category).filter(Boolean))];
            const container = document.getElementById('category-buttons');
            
            container.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="filterCategory('${cat}')">
                    ${cat}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderStore();
        }

        function renderProducts() {
            const container = document.getElementById('product-container');
            const products = getProducts();

            const filtered = currentCategory === 'الكل' 
                ? products 
                : products.filter(p => p.category && p.category.trim() === currentCategory);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="grid-column:1/-1; color:var(--text-muted); text-align:center;">لا توجد منتجات حالياً في هذا القسم.</p>`;
                return;
            }

            container.innerHTML = filtered.map(p => {
                const imagesList = (p.images && p.images.length > 0) ? p.images : ['https://via.placeholder.com/400x300?text=Nuvora'];
                const mainImg = imagesList[0];
                
                let thumbsHTML = '';
                if (imagesList.length > 1) {
                    thumbsHTML = `<div class="thumb-list">` +
                        imagesList.map(imgUrl => 
                            `<img src="${imgUrl}" onclick="this.closest('.product-card').querySelector('.product-thumb img').src='${imgUrl}'">`
                        ).join('') +
                    `</div>`;
                }

                let optionsHTML = '';
                if (p.options && p.options.length > 0) {
                    optionsHTML = `
                        <select class="option-select" id="option-${p.id}">
                            ${p.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                        </select>
                    `;
                }

                return `
                    <article class="product-card">
                        <div class="product-thumb">
                            <img src="${mainImg}" alt="${p.title}">
                        </div>
                        ${thumbsHTML}
                        <div class="product-details">
                            <div>
                                <h3>${p.title}</h3>
                                <div class="price-wrap">
                                    <span class="price">${p.price} ج.م</span>
                                    ${p.oldPrice ? `<span class="old-price">${p.oldPrice} ج.م</span>` : ''}
                                </div>
                            </div>
                            <div>
                                ${optionsHTML}
                                <button class="btn-primary" onclick="addToCart('${p.id}')">إضافة للسلة 🛒</button>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function addToCart(prodId) {
            const products = getProducts();
            const prod = products.find(p => p.id === prodId);
            if (!prod) return;

            const optionSelect = document.getElementById(`option-${prodId}`);
            const selectedOption = optionSelect ? optionSelect.value : null;

            const existingIndex = cart.findIndex(c => c.id === prodId && c.selectedOption === selectedOption);

            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({
                    id: prod.id,
                    title: prod.title,
                    price: prod.price,
                    selectedOption: selectedOption,
                    qty: 1
                });
            }

            updateCartUI();
            alert('تمت إضافة المنتج للسلة');
        }

        function updateCartUI() {
            localStorage.setItem('nuvora_cart', JSON.stringify(cart));
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);

            const cartItemsEl = document.getElementById('cart-items');
            cartItemsEl.innerHTML = '';

            let total = 0;
            cart.forEach((item, index) => {
                const itemTotal = parseFloat(item.price) * item.qty;
                total += itemTotal;
                const optText = item.selectedOption ? ` (${item.selectedOption})` : '';

                cartItemsEl.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.title}${optText}</strong>
                            <br><small>${item.price} ج.م × ${item.qty}</small>
                        </div>
                        <div>
                            <button onclick="changeCartQty(${index}, 1)" style="padding:2px 8px; cursor:pointer;">+</button>
                            <button onclick="changeCartQty(${index}, -1)" style="padding:2px 8px; cursor:pointer;">-</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cart-total').innerText = total;
        }

        function changeCartQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        async function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !address) {
                alert('يرجى ملء جميع البيانات لاستكمال الطلب.');
                return;
            }

            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            let orderMsg = `🛍️ *طلب جديد من متجر Nuvora*\n\n` +
                           `👤 *العميل:* ${name}\n` +
                           `📞 *الهاتف:* ${phone}\n` +
                           `📍 *العنوان:* ${address}\n\n` +
                           `📦 *المنتجات المطلوبة:*\n`;

            let total = 0;
            cart.forEach((item, index) => {
                const itemTotal = parseFloat(item.price) * item.qty;
                total += itemTotal;
                const optText = item.selectedOption ? ` [الخيار: ${item.selectedOption}]` : '';
                orderMsg += `${index + 1}. ${item.title}${optText} (${item.qty} قطعة) - ${itemTotal} ج.م\n`;
            });

            orderMsg += `\n💰 *الإجمالي الكلي:* ${total} ج.م`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: orderMsg,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    alert('تم إرسال طلبك بنجاح! وسنتواصل معك قريباً.');
                    cart = [];
                    updateCartUI();
                    toggleCart();
                    document.getElementById('cust-name').value = '';
                    document.getElementById('cust-phone').value = '';
                    document.getElementById('cust-address').value = '';
                } else {
                    alert('حدث خطأ أثناء إرسال الطلب، يرجى المحاولة لاحقاً.');
                }
            } catch (err) {
                alert('تعذر الاتصال بالسيرفر، تأكد من وجود اتصال بالإنترنت.');
            }
        }

        function renderStore() {
            renderCategoryButtons();
            renderProducts();
        }

        // تشغيل الموقع عند التحميل
        renderStore();
        updateCartUI();
    </script>
</body>
</html>
