<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvora - المتجر الفاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --accent-gold: #d4af37;
            --accent-hover: #f3cf65;
            --text-main: #f0f0f0;
            --text-muted: #aaa;
            --border-color: #2a2a30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        /* Header & Nav */
        header {
            background: rgba(24, 24, 28, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 48px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .cart-btn {
            background: linear-gradient(135deg, var(--accent-gold), #aa820a);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .cart-btn:hover {
            background: var(--accent-hover);
        }

        .cart-badge {
            background: #000;
            color: var(--accent-gold);
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 12px;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 40px 20px;
            background: radial-gradient(circle, #25252e 0%, var(--bg-color) 70%);
        }

        .hero h1 {
            color: var(--accent-gold);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* Product Card */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
        }

        .product-img-wrap {
            width: 100%;
            height: 250px;
            background: #000;
            position: relative;
        }

        .product-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-bar {
            display: flex;
            gap: 6px;
            padding: 8px;
            background: rgba(0,0,0,0.4);
            overflow-x: auto;
        }

        .thumb-bar img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
            object-fit: cover;
        }

        .thumb-bar img.active {
            border-color: var(--accent-gold);
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 1.2rem;
            color: var(--accent-gold);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .option-select {
            width: 100%;
            padding: 8px;
            background: #222;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .btn-add {
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-add:hover {
            background: var(--accent-gold);
            color: #000;
        }

        /* Admin Panel */
        .admin-panel {
            background: #1e1e24;
            border: 1px dashed var(--accent-gold);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .admin-panel h3 {
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        .admin-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .admin-form input, .admin-form textarea {
            padding: 10px;
            background: #121215;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
        }

        .admin-form button {
            grid-column: 1 / -1;
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-inputs {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-inputs input {
            padding: 10px;
            background: #121215;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
        }

        .btn-submit {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            <img src="logo.jpg" alt="Nuvora Logo">
        </a>
        <button class="cart-btn" onclick="toggleCart()">
            🛒 السلة <span class="cart-badge" id="cart-count">0</span>
        </button>
    </header>

    <section class="hero">
        <h1>NUVORA STORE</h1>
        <p>التشكيلات الفاخرة بجودة استثنائية وشحن سريع</p>
    </section>

    <div class="container">

        <!-- Admin Control Panel -->
        <div class="admin-panel" id="admin-panel">
            <h3>لوحة إضافة منتج جديد</h3>
            <div class="admin-form">
                <input type="text" id="p-title" placeholder="اسم المنتج" required>
                <input type="number" id="p-price" placeholder="السعر (ج.م)" required>
                <input type="text" id="p-images" placeholder="روابط الصور مفصولة بفاصلة (مثال: img1.jpg, img2.jpg)">
                <input type="text" id="p-options" placeholder="خيارات/ألوان مفصولة بفاصلة (مثال: أسود, أحمر)">
                <textarea id="p-desc" placeholder="وصف المنتج" style="grid-column: 1 / -1;"></textarea>
                <button onclick="saveProduct()">إضافة المنتج للمتجر</button>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="products-grid"></div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <h2 style="color:var(--accent-gold); margin-bottom:15px;">سلة الشراء</h2>
            <div id="cart-items"></div>
            <h3 style="margin-top:15px; text-align:left;">الإجمالي: <span id="cart-total">0</span> ج.م</h3>

            <div class="cart-inputs">
                <h4>بيانات التوصيل:</h4>
                <input type="text" id="cust-name" placeholder="الاسم بالكامل">
                <input type="tel" id="cust-phone" placeholder="رقم الهاتف">
                <input type="text" id="cust-address" placeholder="العنوان تفصيلياً (المحافظة/المنطقة)">
                <button class="btn-submit" onclick="submitOrder()">إرسال الطلب عبر التليجرام</button>
                <button style="background:transparent; color:#aaa; border:none; margin-top:5px; cursor:pointer;" onclick="toggleCart()">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        // التوكين ومعرف الشات الخاص بـ Telegram Bot
        const BOT_TOKEN = '8992277563:AAGL4PZVwqg2YDYb1xDOmk0QWycl_kuykQ8';
        const CHAT_ID = '8951186041';

        // دالة معالجة روابط Google Drive تلقائياً
        function formatImgUrl(url) {
            if (!url) return 'https://via.placeholder.com/300?text=Nuvora';
            url = url.trim();
            if (url.includes('drive.google.com') && url.includes('/d/')) {
                const match = url.match(/\/d\/([^\/]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
            }
            return url;
        }

        // جلب المنتجات المخزنة أو تعيين افتراضية
        let products = JSON.parse(localStorage.getItem('nuvora_products')) || [];
        let cart = JSON.parse(localStorage.getItem('nuvora_cart')) || [];

        function saveProduct() {
            const title = document.getElementById('p-title').value.trim();
            const price = parseFloat(document.getElementById('p-price').value);
            const rawImages = document.getElementById('p-images').value;
            const rawOptions = document.getElementById('p-options').value;
            const desc = document.getElementById('p-desc').value.trim();

            if (!title || isNaN(price)) {
                alert('يرجى كتابة اسم المنتج والسعر بشكل صحيح');
                return;
            }

            const imagesArray = rawImages ? rawImages.split(',').map(url => formatImgUrl(url)) : ['https://via.placeholder.com/300?text=Nuvora'];
            const optionsArray = rawOptions ? rawOptions.split(',').map(opt => opt.trim()).filter(opt => opt !== '') : [];

            const newProd = {
                id: Date.now(),
                title,
                price,
                images: imagesArray,
                options: optionsArray,
                desc
            };

            products.push(newProd);
            localStorage.setItem('nuvora_products', JSON.stringify(products));
            renderProducts();
            alert('تمت إضافة المنتج بنجاح!');
            
            // إعادة تعيين الخانات
            document.getElementById('p-title').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-images').value = '';
            document.getElementById('p-options').value = '';
            document.getElementById('p-desc').value = '';
        }

        function renderProducts() {
            const container = document.getElementById('products-grid');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">لا توجد منتجات حالياً. استخدم لوحة التحكم بالأعلى لإضافة منتجاتك.</p>';
                return;
            }

            products.forEach(p => {
                const mainImg = p.images && p.images.length > 0 ? p.images[0] : 'https://via.placeholder.com/300';
                
                let thumbHTML = '';
                if (p.images && p.images.length > 1) {
                    thumbHTML = `<div class="thumb-bar">` +
                        p.images.map((img, idx) => `<img src="${img}" class="${idx === 0 ? 'active' : ''}" onclick="changeImg(${p.id}, '${img}', this)">`).join('') +
                    `</div>`;
                }

                let optionsHTML = '';
                if (p.options && p.options.length > 0) {
                    optionsHTML = `<select class="option-select" id="opt-${p.id}">` +
                        p.options.map(o => `<option value="${o}">${o}</option>`).join('') +
                    `</select>`;
                }

                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-wrap">
                            <img src="${mainImg}" id="main-img-${p.id}" alt="${p.title}">
                        </div>
                        ${thumbHTML}
                        <div class="product-info">
                            <div>
                                <div class="product-title">${p.title}</div>
                                <div class="product-desc">${p.desc || ''}</div>
                            </div>
                            <div>
                                <div class="product-price">${p.price} ج.م</div>
                                ${optionsHTML}
                                <button class="btn-add" onclick="addToCart(${p.id})">إضافة للسلة 🛒</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function changeImg(prodId, newSrc, thumbEl) {
            document.getElementById(`main-img-${prodId}`).src = newSrc;
            const parent = thumbEl.parentElement;
            parent.querySelectorAll('img').forEach(img => img.classList.remove('active'));
            thumbEl.classList.add('active');
        }

        function addToCart(prodId) {
            const prod = products.find(p => p.id === prodId);
            if (!prod) return;

            const optEl = document.getElementById(`opt-${prodId}`);
            const selectedOpt = optEl ? optEl.value : null;

            const existingIndex = cart.findIndex(c => c.id === prodId && c.selectedOpt === selectedOpt);
            
            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({
                    id: prod.id,
                    title: prod.title,
                    price: prod.price,
                    selectedOpt: selectedOpt,
                    qty: 1
                });
            }

            updateCartUI();
            alert('تمت إضافة المنتج للسلة');
        }

        function updateCartUI() {
            localStorage.setItem('nuvora_cart', JSON.stringify(cart));
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);

            const cartItemsEl = document.getElementById('cart-items');
            cartItemsEl.innerHTML = '';

            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                const optText = item.selectedOpt ? ` (${item.selectedOpt})` : '';
                cartItemsEl.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.title}${optText}</strong>
                            <br><small>${item.price} ج.م × ${item.qty}</small>
                        </div>
                        <div>
                            <button onclick="changeCartQty(${index}, 1)" style="padding:2px 8px;">+</button>
                            <button onclick="changeCartQty(${index}, -1)" style="padding:2px 8px;">-</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cart-total').innerText = total;
        }

        function changeCartQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        async function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !address) {
                alert('يرجى ملء كافة بيانات التوصيل.');
                return;
            }

            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            let itemsList = cart.map((item, index) => {
                const optText = item.selectedOpt ? ` [الخيار: ${item.selectedOpt}]` : '';
                return `${index + 1}. ${item.title}${optText}\n    العدد: ${item.qty} | السعر: ${item.price * item.qty} ج.م`;
            }).join('\n');

            let totalSum = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const message = `🛍️ *طلب جديد من متجر Nuvora*\n\n` +
                            `👤 *اسم العميل:* ${name}\n` +
                            `📞 *رقم الهاتف:* ${phone}\n` +
                            `📍 *العنوان:* ${address}\n\n` +
                            `📦 *المنتجات المطلوبة:*\n${itemsList}\n\n` +
                            `💰 *الإجمالي النهائي:* ${totalSum} جنيه مصري`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    alert('تم إرسال طلبك بنجاح! وسنتواصل معك قريباً لتأكيد الشحن.');
                    cart = [];
                    updateCartUI();
                    toggleCart();
                    document.getElementById('cust-name').value = '';
                    document.getElementById('cust-phone').value = '';
                    document.getElementById('cust-address').value = '';
                } else {
                    alert('حدث خطأ أثناء إرسال الطلب، يرجى المحاولة مرة أخرى.');
                }
            } catch (error) {
                alert('تعذر الاتصال بالسيرفر، يرجى التأكد من الاتصال بالإنترنت.');
            }
        }

        // تشغيل البداية
        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
